seed: 1337

model:
  name: Qwen/Qwen2.5-0.5B
  trust_remote_code: true

paths:
  output_dir: outputs/qwen05b_noise
  data_cache_dir: outputs/qwen05b_noise/data/ai_mo_numinamath_cot_sft_masked
  warmup_dir: outputs/qwen05b_noise/checkpoints/warmup
  utility_labels: outputs/qwen05b_noise/utility_labels.pt
  utility_labels_jsonl: outputs/qwen05b_noise/utility_labels.jsonl
  evaluator: outputs/qwen05b_noise/evaluator.pt
  evaluator_metrics: outputs/qwen05b_noise/evaluator_metrics.json
  evaluator_dev_predictions: outputs/qwen05b_noise/evaluator_dev_predictions.csv
  curves_dir: outputs/qwen05b_noise/curves
  logs_dir: outputs/qwen05b_noise/logs
  plots_dir: outputs/qwen05b_noise/plots

data:
  dataset_name: AI-MO/NuminaMath-CoT
  split: train
  max_seq_len: 1024
  train_pool_size: 20000
  utility_val_size: 1000
  test_size: 1000
  preprocessing_margin: 1000
  enable_synthetic_noise: true
  noise_fraction: 0.50
  noise_types: [shuffled_response, truncated_response, generic_response, verbose_distractor]
  # Keep this false for the main experiment. If true, the evaluator can directly
  # see the synthetic-noise flag, which makes the stress test less realistic.
  feed_noise_feature_to_evaluator: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  micro_batch_size: 4
  lr: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 200
  continuation_steps: 1800
  log_every: 20
  eval_every: 100
  eval_batches: 32
  save_every: 0

utility:
  # More collection states and more candidates per state than default.
  # This gives the evaluator many more labels and reduces the chance that the
  # adaptive selector is trained on a tiny/noisy utility-label set.
  label_steps: [200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000]
  candidates_per_state: 500
  candidate_batch_size: 4
  val_batch_size: 4
  val_batches_per_state: 16
  use_gradient_features: false

features:
  use_gradient_features: false

evaluator:
  target: step_zscore_utility
  hidden_size: 128
  epochs: 120
  lr: 1.0e-3
  batch_size: 128
  dev_fraction: 0.2
  max_pairs_per_batch: 4096
  loss: pairwise

static_loss:
  strategy: middle-loss
  candidate_batches: 512
  selected_fraction: 0.25
  ensure_selected_steps: true

static_gradient:
  candidate_batches: 200
  selected_fraction: 0.25
  ensure_selected_steps: true

adaptive:
  score_source: auto
  # Keep false so adaptive_utility_sft remains a real evaluator test.
  # If this is true, weak evaluators fall back to middle-loss selection.
  fallback_on_weak_evaluator: false
  min_dev_spearman: 0.10
  min_dev_ranking_accuracy: 0.55
  fallback_score_source: middle-loss
  candidate_count: 16
  candidate_batches_k: 16
  standardize_candidate_scores: true
  temperature: 0.25
  selection: softmax
  use_gradient_features: false

oracle:
  enabled: true
  selection: top1
  val_gradient_refresh_steps: 1
  candidate_count: 16

diagnostics:
  evaluator_imitation_sets: 128
  evaluator_imitation_checkpoint_method: warmup
  gradient_signal_candidates: 64
  candidate_count: 16
  val_batch_size: 4

seeds: [1, 2, 3, 4, 5]
seed_aggregation:
  threshold: null

evaluation:
  batch_size: 4
  max_test_batches: 0
  generate_samples: false
  generation_count: 100
  max_new_tokens: 128

smoke:
  output_dir: outputs/smoke_qwen05b_noise
  overrides:
    data:
      train_pool_size: 1000
      utility_val_size: 100
      test_size: 100
      preprocessing_margin: 100
      noise_fraction: 0.50
    training:
      warmup_steps: 20
      continuation_steps: 50
      eval_every: 10
      eval_batches: 4
      micro_batch_size: 4
    utility:
      label_steps: [20, 35, 50, 70]
      candidates_per_state: 16
      candidate_batch_size: 4
      val_batch_size: 4
      val_batches_per_state: 8
    evaluator:
      epochs: 40
      batch_size: 16
      max_pairs_per_batch: 512
    static_loss:
      candidate_batches: 16
      selected_fraction: 0.5
    static_gradient:
      candidate_batches: 8
      selected_fraction: 0.5
    adaptive:
      candidate_count: 4
      candidate_batches_k: 4
    oracle:
      candidate_count: 4
    diagnostics:
      evaluator_imitation_sets: 16
      gradient_signal_candidates: 16
      candidate_count: 4
    evaluation:
      batch_size: 4
      max_test_batches: 8
